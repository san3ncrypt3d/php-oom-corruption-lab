; Stopgap mitigations for CVE-2026-109618 / -109619. Use only until you can
; upgrade to 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12. These shrink the attack surface;
; they do not fix the Zend OOM core. Upgrade as soon as possible.

; Closes the pre-auth session injection surface. Highest-value setting.
session.upload_progress.enabled = Off

; Session IDs from cookies only; reject unknown IDs.
session.use_only_cookies = On
session.use_strict_mode  = On

; One serialize handler everywhere (kills the handler-mismatch path).
session.serialize_handler = php

; Shrink the startup-OOM window. Raises the bar, does not remove the bug.
post_max_size   = 8M
upload_max_filesize = 8M
memory_limit    = 256M
max_input_vars  = 1000

display_errors  = Off
log_errors      = On
